# Lints the shared workflows on every pull request. main requires the "ci / check" result.
name: CI

on:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: ci / check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: actionlint
        run: docker run --rm -v "$PWD:/repo" --workdir /repo rhysd/actionlint:1.7.12 -color
